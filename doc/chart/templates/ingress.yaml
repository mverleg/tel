apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: {{ ternary "letsencrypt-prod" "letsencrypt-staging" .Values.prod | quote }}
    # When prod=false the cert is from letsencrypt-staging (untrusted).
    # Disable HSTS so Firefox/Chrome don't pin the host to HTTPS-only,
    # which would block the "accept self-signed" override.
    nginx.ingress.kubernetes.io/hsts: {{ .Values.prod | quote }}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: 80
