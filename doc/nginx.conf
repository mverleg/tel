server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  etag on;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain text/css text/javascript application/javascript application/x-javascript
    application/json application/manifest+json application/xml
    application/rss+xml image/svg+xml;

  error_page 404 /404.html;

  # HTML pages: revalidate often so deploys land quickly.
  location ~ \.html$ {
    try_files $uri =404;
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }

  # Hashed/fingerprinted assets shipped by mdBook: cache aggressively.
  location ~* \.(css|js|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
  }
}
