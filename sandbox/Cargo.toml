[package]
name = "sandbox"
edition.workspace = true
version.workspace = true

[dependencies]
async-lazy = { path = "../async-lazy" }
dashmap.workspace = true
env_logger.workspace = true
log.workspace = true
# Disk backend of src/monitor.rs (approved 2026-07-05 with the monitor work).
notify = "8.2.0"
# Value encoding of the persistent cache (approved 2026-07-06): portable
# entries (src/portable.rs) serialized with postcard into LMDB (src/disk.rs).
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
# Stable hasher behind StableHasher in src/keys.rs (approved 2026-07-06 with
# the persistence work): xxh3-128 content keys, xxh3-64 fingerprints.
xxhash-rust.workspace = true

[features]
# Debug step tracing: every parse/resolve/mono/exec step appends one JSON line
# (logical id, key hash, cache hit/miss, entry age, duration in micros) to
# $TEL_SANDBOX_TRACE_FILE (default tel-sandbox-trace.jsonl) — see src/trace.rs.
# Off by default; when off the tracer compiles to zero-sized no-ops.
step-trace = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tokio = { workspace = true, features = ["sync", "time"] }
pprof = { version = "0.14", features = ["flamegraph", "criterion"] }
rand.workspace = true
tempfile = "3.15"

[[bench]]
name = "large_project"
harness = false
